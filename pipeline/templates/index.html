<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seattle Fall Color Sentinel</title>
<meta name="description" content="Where fall colour is turning across Seattle and King County, from Sentinel-2 imagery, tree phenology and weather.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: the map fills the screen; a bottom strip holds the week stepper and legend; details live in a sheet (phone) or a right-hand panel (desktop).
   Colour rule: the fall-colour scale (green → yellow → orange → red, brown for leaf-off) is the ONLY chromatic element and is used only to encode colour state. All chrome is neutral. */
:root{
  --bg:#f4f3ef; --panel:#fbfaf7; --panel-2:#edebe5; --fg:#1b1a18; --muted:#66625b; --line:#d6d2c9; --ink:#2a2824; --ink-fg:#fbfaf7;
  --c1:#1a8026; --c2:#f2d91a; --c3:#fa8c0d; --c4:#d91a0d; --c5:#785540;   /* data scale: green, yellow, orange, red, leaf-off brown */
  --display:"Fraunces",Georgia,serif; --body:"Source Sans 3",system-ui,sans-serif;
  --sheet:36vh; --strip:92px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151617;--panel:#1e2022;--panel-2:#2a2d30;--fg:#ebe8e1;--muted:#a19c93;--line:#3b3f44;--ink:#ebe8e1;--ink-fg:#151617;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151617;--panel:#1e2022;--panel-2:#2a2d30;--fg:#ebe8e1;--muted:#a19c93;--line:#3b3f44;--ink:#ebe8e1;--ink-fg:#151617;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:inherit}
#app{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;grid-template-columns:1fr}
#mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:#0f1113}
.leaflet-container{font-family:var(--body);background:#0f1113}
.leaflet-top.leaflet-right{margin-top:calc(46px + env(safe-area-inset-top,0px))}
.topbar{position:absolute;top:0;left:0;right:0;z-index:1100;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand h1{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em;line-height:1.1;background:var(--panel);padding:4px 10px;border-radius:8px;border:1px solid var(--line)}
.spacer{flex:1}
.btn{padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center;line-height:1.2}
#btn-layers{max-width:46vw;white-space:nowrap}
#btn-layers span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.btn[aria-pressed=true],.btn.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink);font-weight:600}
.btn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible,.item:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.layerbox{position:absolute;right:12px;top:calc(52px + env(safe-area-inset-top,0px));z-index:1150;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;width:min(320px,calc(100vw - 24px));box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px}
.layerbox label{display:flex;align-items:center;gap:8px;font-size:14px}
.layerbox .row{display:flex;gap:8px 14px;flex-wrap:wrap}
.layerbox select{width:100%;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2)}
.layerbox input[type=checkbox]{accent-color:var(--ink)}
/* bottom strip: stepper + legend + provenance */
.strip{position:absolute;left:0;right:0;bottom:0;z-index:1100;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px 8px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
@media (max-width:899px){.strip{grid-template-columns:1fr}.legend{max-width:none}.prov{grid-column:1}.step{min-width:56px}}
.stepper{display:flex;gap:4px;align-items:stretch;overflow-x:auto;scrollbar-width:none}
.step{flex:1 0 auto;min-width:64px;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:4px 6px;font-size:12px;line-height:1.15;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.step b{font-weight:600;font-size:12.5px}
.step small{color:var(--muted);font-size:11px}
.step[aria-pressed=true]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.step[aria-pressed=true] small{color:var(--ink-fg);opacity:.75}
.step:disabled{opacity:.4;cursor:default}
.step.fc{border-style:dashed}
.step.fc[aria-pressed=true]{background:var(--panel);color:var(--fg);border:2px dashed var(--ink)}
.step.fc small{font-style:italic}
.stepgap{width:1px;background:var(--line);margin:4px 2px;flex:none}
.tl{display:block;width:100%;height:auto}
.tl text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.tl .ax{stroke:var(--line);stroke-width:1}
.tl .obs{fill:none;stroke:var(--fg);stroke-width:1.6}
.tl .fc{fill:none;stroke:var(--fg);stroke-width:1.4;stroke-dasharray:3 3;opacity:.8}
.tl .win{fill:var(--ink);opacity:.12}
.tl .today{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.fctag{display:inline-block;padding:0 5px;border:1px dashed var(--muted);border-radius:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.listhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;margin:4px 0 8px;font-size:13px}
.listhead .count{font-weight:600}
.listhead select{padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);font-size:13px}
.item.selected{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.item.hl{background:var(--panel)}
.item .far{font-size:12px;color:var(--muted)}
.groupcap{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px}
.regioncard{border:1px dashed var(--ink);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--panel)}
.regioncard h3{font-family:var(--display);font-size:17px;margin-bottom:2px}
.regioncard .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13.5px;margin:4px 0}
.regionpick{display:flex;gap:6px;align-items:center;margin:0 0 8px}
.regionpick select{flex:1;min-width:0;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2)}
.rrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);cursor:pointer;text-align:left;width:100%}
.rrow .name{font-weight:600}.rrow .sub{grid-column:1;font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rrow .stack{grid-column:2;grid-row:1/3;width:72px;margin:0;height:8px}
.search{width:100%;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);margin:0 0 8px}
.playbtn{align-self:stretch;min-width:40px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);cursor:pointer;font-size:14px}
.legend{font-size:12px;min-width:0;max-width:260px}
.legend b{display:block;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .ramp{height:8px;border-radius:4px;margin:2px 0}
.legend .labels{display:flex;justify-content:space-between;gap:4px;color:var(--muted);font-size:10.5px}
.legend .cls{display:flex;gap:8px;flex-wrap:wrap}
.legend .cls span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.legend .cls i{width:11px;height:11px;border-radius:3px;display:inline-block}
.prov{grid-column:1/-1;color:var(--muted);font-size:11.5px;display:flex;gap:12px;flex-wrap:wrap}
/* sheet / panel */
.sheet{position:absolute;left:0;right:0;bottom:0;height:var(--sheet);z-index:1200;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.22);transition:height .25s ease}
.sheet.collapsed{height:84px}
.grip{height:18px;display:flex;align-items:center;justify-content:center;cursor:grab;flex:none}
.grip i{width:40px;height:4px;border-radius:2px;background:var(--line)}
.verdict{padding:0 14px 6px;font-size:14px;line-height:1.35;flex:none}
.verdict b{font-weight:700}
.verdict .more{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:2px;padding:0 10px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
.tab{padding:6px 11px;border-radius:999px;border:1px solid transparent;background:transparent;cursor:pointer;white-space:nowrap;font-size:14px;color:var(--muted)}
.tab[aria-selected=true]{background:var(--panel-2);border-color:var(--line);color:var(--fg);font-weight:600}
.sheet-body{flex:1;overflow:auto;padding:4px 14px calc(16px + env(safe-area-inset-bottom,0px));min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.filters .btn{padding:4px 9px;font-size:13px}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:26px 1fr auto;gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--ink)}
.item .rank{font-weight:700;color:var(--muted);text-align:center;font-size:14px}
.item .name{font-weight:600;min-width:0;line-height:1.25}
.item .sub{grid-column:2;color:var(--muted);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .right{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.scorebar{width:64px;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.scorebar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:3px}
.scoretxt{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
.pill.s1{background:var(--c1);color:#fff}.pill.s2{background:var(--c2);color:#1b1a18}.pill.s3{background:var(--c3);color:#1b1a18}.pill.s4{background:var(--c5);color:#fff}.pill.s0{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11.5px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin:6px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;height:9px;border-radius:4px;overflow:hidden;margin:4px 0 2px;background:var(--line)}
.stack i{display:block;height:100%}
.stacklbl{display:flex;gap:10px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:400;font-size:12px}
td.n,th.n{text-align:right}
.tablewrap{overflow-x:auto;margin:6px 0 12px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.stat div{padding:8px 10px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line)}
.stat b{display:block;font-size:19px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.note{padding:8px 10px;border-left:3px solid var(--ink);background:var(--panel-2);border-radius:0 8px 8px 0;font-size:14px;margin:8px 0}
.about p,.about li{max-width:65ch}
.mtoolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:6px 0 10px}
.mnav{display:flex;gap:4px;flex-wrap:wrap}
.mnav a{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--muted)}
.mnav a:hover{color:var(--fg);border-color:var(--ink)}
.mtools{display:flex;gap:6px}.mtools .btn{padding:3px 9px;font-size:12px}
.mintro{max-width:65ch;margin:0 0 10px}
.msec{border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:var(--panel-2)}
.msec[open]{background:var(--panel)}
.msec.pinned{border-color:var(--ink)}
.msec>summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;font-weight:600}
.msec>summary::-webkit-details-marker{display:none}
.msec>summary::before{content:"▸";color:var(--muted);font-weight:400;width:10px}
.msec[open]>summary::before{content:"▾"}
.mnum{font-family:var(--display);color:var(--muted);font-weight:600;min-width:18px}
.mtitle{flex:1;min-width:0}
.mpin{border:1px solid var(--line);background:transparent;border-radius:6px;width:28px;height:26px;cursor:pointer;color:var(--muted);font-size:15px;line-height:1}
.msec.pinned .mpin{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.mbody{padding:0 12px 12px}
.mbody p,.mbody li{max-width:65ch}
.mbody ol,.mbody ul{padding-left:20px}
.mbody h4{margin:10px 0 4px;font-size:14px}
.mnote{padding:8px 10px;border-left:3px solid var(--ink);background:var(--panel-2);border-radius:0 8px 8px 0;font-size:13.5px;margin:10px 0}
.mcode{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;overflow-x:auto;line-height:1.45}
.mfig{margin:12px 0}
.mfig figcaption{font-size:13px;color:var(--muted);margin-top:6px;max-width:65ch}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.mgrid.two{grid-template-columns:repeat(2,1fr)}.mgrid.three{grid-template-columns:repeat(3,1fr)}
.mgrid figure{margin:0}.mgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;image-rendering:auto}
.mgrid .lbl{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;gap:6px}
.mchart svg{width:100%;height:auto;display:block}
.mchart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.mchart .ax{stroke:var(--line);stroke-width:1}
.mchart .grid{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 3}
.mchart .lg{font-size:10.5px;fill:var(--fg)}
details summary{cursor:pointer;font-weight:600;margin:6px 0}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--fg);border-radius:10px;border:1px solid var(--line);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:10px 12px;font-family:var(--body);font-size:14px;line-height:1.35;min-width:260px;max-width:320px}
.leaflet-popup-content h3{font-family:var(--display);font-size:16px;margin-bottom:4px;font-weight:600}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.rank-badge{background:#1b1a18;color:#fff;font:600 12px/20px var(--body);width:22px;height:22px;border-radius:50%;text-align:center;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.stn{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #e8e6e0;filter:drop-shadow(0 0 2px #000)}
.rep{width:13px;height:13px;border-radius:2px;background:#e8e6e0;border:2px solid #1b1a18;transform:rotate(45deg)}
.plabel{color:#f1efe9;font:600 12px/1 var(--body);text-shadow:0 0 3px #000,0 0 6px #000,0 1px 2px #000;white-space:nowrap;letter-spacing:.02em;pointer-events:none}
.plabel.water{color:#b9c6cf;font-weight:400;font-style:italic}
.base-grey{filter:grayscale(1) brightness(.95)}
.leaflet-control-attribution{background:rgba(0,0,0,.45)!important;color:#ccc!important;font-size:10px}
.leaflet-control-attribution a{color:#ddd!important}
.spark{display:block}
@media (min-width:900px){
  #app{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:minmax(0,1fr)}
  #mapwrap{grid-column:1;min-height:0}
  .sheet{position:relative;height:100%!important;min-height:0;overflow:hidden;grid-column:2;border-top:0;border-left:1px solid var(--line);border-radius:0;box-shadow:none;transition:none}
  .sheet.collapsed{height:auto}
  .grip{display:none}
  .verdict{padding-top:12px}
  .strip{grid-template-columns:1fr auto}
}
@media (max-width:899px){.strip{bottom:var(--sheet)}.topbar .brand h1{font-size:17px}.sheet.collapsed ~ .strip{bottom:84px}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

<script>{{LEAFLET_JS}}</script>
<script>
(async function(){
const $=s=>document.querySelector(s);
const STAGE={1:['green','s1'],2:['turning','s2'],3:['peak colour','s3'],4:['past peak','s4']};
const RAMP=[[26,128,38],[242,217,26],[250,140,13],[217,26,13]];
const fmt=(x,d=0)=>x==null||isNaN(x)?'–':Number(x).toFixed(d);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dstr=d=>`${MON[d.getMonth()]} ${d.getDate()}`;
const isoDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let site,weather,stations,reports,bounds,placesFC,regionsFC,places;

function spark(series,w=64,h=20,forecast=null){const ov=Object.values(series||{}), fv=Object.values(forecast||{}); const vals=[...ov,...fv]; if(!ov.some(v=>v!=null))return'';const n=vals.length;const X=i=>(i/(n-1))*(w-4)+2, Y=v=>h-2-Math.max(0,Math.min(1,v))*(h-5);
  const seg=(arr,off)=>arr.map((v,i)=>v==null?null:[X(i+off),Y(v)]).filter(Boolean); const po=seg(ov,0), pf=seg(fv,ov.length); if(!po.length)return'';
  const d=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '); const lo=po[po.length-1]; const lv=ov.filter(v=>v!=null).pop();
  const bridge=pf.length?`<path d="M${lo[0].toFixed(1)} ${lo[1].toFixed(1)} L${pf[0][0].toFixed(1)} ${pf[0][1].toFixed(1)} ${d(pf).slice(1)}" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.3" stroke-dasharray="2 2"/>`:'';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d(po)}" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1.5"/>${bridge}<circle cx="${lo[0]}" cy="${lo[1]}" r="2.6" fill="${rampColor(lv)}" stroke="#1b1a18" stroke-width=".8"/></svg>`}
function timeline(p){
  const obs=Object.entries(p.series||{}), fc=Object.entries(p.forecast||{});
  const labs=[...obs.map(o=>o[0]),...fc.map(o=>o[0])]; const vals=[...obs.map(o=>o[1]),...fc.map(o=>o[1])]; const n=labs.length; if(n<2) return '';
  const W=300,H=96,L=26,Rr=8,T=10,B=26; const x=i=>L+(i/(n-1))*(W-L-Rr); const y=v=>T+(1-Math.max(0,Math.min(1,v)))*(H-T-B);
  const path=(arr,off)=>arr.map(([k,v],i)=>v==null?null:[x(i+off),y(v)]).filter(Boolean).map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
  const lastObs=obs.length-1; const bridge=fc.length&&obs[lastObs][1]!=null&&fc[0][1]!=null?`M${x(lastObs).toFixed(1)} ${y(obs[lastObs][1]).toFixed(1)} L${x(lastObs+1).toFixed(1)} ${y(fc[0][1]).toFixed(1)}`:'';

  const tx=x(lastObs);
  return `<svg class="tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="Colour score by week, observed and forecast">
   <line class="ax" x1="${L}" x2="${W-Rr}" y1="${H-B}" y2="${H-B}"/><line class="ax" x1="${L}" x2="${W-Rr}" y1="${T}" y2="${T}" stroke-dasharray="2 3"/>

   ${win}<line class="today" x1="${tx.toFixed(1)}" x2="${tx.toFixed(1)}" y1="${T}" y2="${H-B}"/><text x="${tx.toFixed(1)}" y="${T-3}" text-anchor="middle">now</text>
   <path class="obs" d="${path(obs,0)}"/>${bridge?`<path class="fc" d="${bridge}"/>`:''}<path class="fc" d="${path(fc,obs.length)}"/>
   ${obs.map(([k,v],i)=>v==null?'':`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${rampColor(v)}" stroke="var(--panel)" stroke-width="1"/>`).join('')}
   ${fc.map(([k,v],i)=>v==null?'':`<circle cx="${x(obs.length+i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="var(--panel)" stroke="${rampColor(v)}" stroke-width="1.6"/>`).join('')}
   ${labs.map((k,i)=>(i%2===0)?`<text x="${x(i).toFixed(1)}" y="${H-B+12}" text-anchor="middle">${k.split('-')[0].trim()}</text>`:'').join('')}
  </svg>`;
}

function layerFile(region,k,w){
  const R=site.regions[region]; if(!R) return null;
  if(['cs','stage','rgb'].includes(k)){
    if(isForecast(w)){ const f=(R.forecast||[])[w-NOW-1]; return (k==='rgb'||!f)?null:f[k]; }
    if(k==='rgb') return R.weeks[Math.min(w,weeks.length-1)].rgb;   // that week's cloud-free imagery, over the sharp base
    if(w>=NOW) return k==='cs'?R.layers.cs_now.file:R.layers.stage.file;

}

  const el=$('#legend');
  if(!meta){el.innerHTML='<b>Sentinel-2 imagery</b><div class="muted">cloud-free median for the selected week</div>';return}
  let h=`<b>${meta.title}</b>`; const lg=meta.legend;

}

    body.querySelectorAll('.item').forEach(b=>b.onclick=e=>{if(e.target.tagName==='A')return;const f=fs[+b.dataset.i];$('#chk-reports').checked=true;reportLayer.addTo(map);const target=reportMarkers.find(m=>m._p===f.properties);if(target)flyTo(target,target.getLatLng())});
  } else if(tab==='about'){
    renderMethod(); return;
  } else {
    const sf=sumS.stage_fraction||{}, cf=sumC.stage_fraction||{};
    body.innerHTML=`<div class="about"><div class="stat"><div><b>${Math.round((sf.turning||0)*100)}% / ${Math.round((cf.turning||0)*100)}%</b><span>deciduous trees turning, Seattle / county</span></div><div><b>${Math.round((sf.peak||0)*100)}% / ${Math.round((cf.peak||0)*100)}%</b><span>at peak colour, Seattle / county</span></div><div><b>${sumS.median_days_to_peak!=null?dstr(new Date(today.getTime()+sumS.median_days_to_peak*864e5)):'–'}</b><span>median predicted peak, Seattle</span></div><div><b>${dstr(isoDate(summary.latest_obs))}</b><span>latest clear observation</span></div></div>
    <h3>How this map is made</h3>
    <p><b>Imagery.</b> Every Sentinel-2 L2A scene over MGRS tiles 10TET and 10TFT since Sept 1 is read from the public AWS archive at 10 m (Seattle) and 20 m (King County). Clouds, cirrus, shadows, snow and haze over vegetation are removed per pixel with the scene classification band plus blue and SWIR brightness tests, then dilated. Each week's layer is the median of its clear observations; “Now” is the latest clear observation per pixel, back-filled from the previous two weeks where the newest pass was cloudy, and the strip above states the date range actually used.</p>
    <p><b>Colour measures.</b> Hue and chroma come from the red, green and blue bands, so a pixel's shift from green toward yellow, orange and red is measured directly. The Plant Senescence Reflectance Index, (red − blue) / red-edge 2, tracks the carotenoid-to-chlorophyll ratio that rises as leaves senesce. NDVI and the red-edge chlorophyll index track greenness loss; NDMI (NIR, SWIR) flags leaf-off. The colour score blends hue shift and PSRI rise relative to each pixel's own early-September baseline, scaled down once NDVI shows the leaves are gone.</p>
    <p><b>Stages.</b> Green, turning, peak and past-peak are thresholds on the colour score and the NDVI drop. Conifers and lawns stay green and are not counted. Hotspot timing is reconciled with stage: a spot whose trees read as peak is never shown as “peak in a week”.</p>
    <p><b>Forecast weeks and timing.</b> The dashed steps after “Now” are predictions: each pixel's typical colour curve from 2023–25 is shifted by how far ahead or behind this year is running, and pulled earlier when cold nights are forecast. They use the same stage colours as the observed weeks and fade where confidence is low. The “Predicted peak timing” layer groups the same prediction into five chronological classes (past peak in leaf-off brown, peak now darkest, later lighter). Every card shows an observed-then-forecast timeline with the predicted peak date and its uncertainty window.</p>
    <p><b>Phenology.</b> Autumn 2023, 2024 and 2025 were processed the same way at 80 m. Each pixel gets a typical colour curve, peak week and autumn amplitude; small amplitude means evergreen. This year's progress is matched to that curve to estimate how many days ahead of or behind a normal year the spot is, which gives the predicted peak date, pulled earlier when cold nights are forecast and more so at elevation.</p>
    <p><b>Weather.</b> Nightly lows and cold-night counts come from NOAA GHCN stations (airports, SNOTEL) compared with the same dates in prior years, HRRR 3 km analyses fill the days after the station feed, and the 7-day outlook is the latest GFS run. Cold nights accelerate colour; strong wind or heavy rain after peak ends the show.</p>
    <p><b>Hotspots and scores.</b> Tree pixels are aggregated to 100 m cells in Seattle and 200 m cells elsewhere; the top tenth by colour score are grouped into contiguous hotspots and labelled by the nearest destination, neighbourhood or town. “Canopy” hotspots are mostly tree cover; “meadow / shrub” ones are huckleberry and mountain-ash slopes. The worth-a-visit score weights colour intensity 45%, timing against the predicted peak 20%, public access 20% and size 15%; it ranks places, it is not a measurement.</p>
    <p><b>Orientation.</b> The base is the latest clear 10 m Sentinel-2 pixel (the cloud-free Oct 11 pass over Seattle and the western county, older passes where that one was cloudy), sharpened and shown in greyscale so colour on the map is always data. The Base menu also offers each Sentinel-2 image in colour, including the cloud-free Sep 16 pass as a "before" picture, so the change the colour layer reports can be checked against the imagery itself with the overlay turned off. Roads and water outlines come from Overture Maps; major roads show county-wide and residential streets appear inside Seattle from zoom 13. Esri World Imagery and OpenStreetMap bases are offered for the GitHub Pages copy, where outside tiles can load.</p>
    <p><b>Colour on this page.</b> The green–yellow–orange–red scale is used only to show colour state, on the map, in the stage pills and at the end of each sparkline. The timing layer uses one cool hue (plus leaf-off brown for past peak) and the diagnostic layers use greys and teals, so orange never means anything but fall colour. The imagery base is greyscale by default for the same reason.</p>
    <p><b>Limits.</b> A 10 m pixel mixes several trees; street trees under cloud for two weeks show their last clear state; the phenology baseline is coarse, so timing is a guide. Reports are quoted from and linked to their sources.</p>
    <p class="muted">Generated ${site.generated}. Pipeline code: the <code>pipeline/</code> folder of this repository.</p></div>`;
  }
}

const BANDS=[['blue',490],['green',560],['red',665],['rededge1',705],['rededge2',740],['rededge3',783],['nir',842],['nir08',865],['swir16',1610],['swir22',2190]];
function chartSpectra(S){
  const W=320,H=196,L=34,R=10,T=14,B=56; const n=BANDS.length; const x=i=>L+i*(W-L-R)/(n-1); const ymax=0.5; const y=v=>T+(1-Math.min(v,ymax)/ymax)*(H-T-B);
  const series=[['deciduous_sept','Deciduous, '+dstr(isoDate(S.deciduous_sept.date)),'var(--c1)',''],['deciduous_oct','Deciduous, '+dstr(isoDate(S.deciduous_oct.date)),'var(--c3)',''],['conifer_sept','Conifer, '+dstr(isoDate(S.conifer_sept.date)),'var(--muted)',''],['conifer_oct','Conifer, '+dstr(isoDate(S.conifer_oct.date)),'var(--muted)','4 3']];
  const path=k=>BANDS.map(([b],i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(S[k].values[b]).toFixed(1)).join(' ');
  const vis=`<rect x="${x(0)-6}" y="${T}" width="${x(2)-x(0)+12}" height="${H-T-B}" fill="var(--line)" opacity=".35"/><text x="${x(1)}" y="${T+9}" text-anchor="middle">visible</text><text x="${(x(3)+x(5))/2}" y="${T+9}" text-anchor="middle">red edge</text><text x="${(x(6)+x(7))/2}" y="${T+9}" text-anchor="middle">near-IR</text><text x="${(x(8)+x(9))/2}" y="${T+9}" text-anchor="middle">shortwave-IR</text>`;
  const grid=[0.1,0.2,0.3,0.4].map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v.toFixed(1)}</text>`).join('');
  const lines=series.map(([k,lab,col,dash])=>`<path d="${path(k)}" fill="none" stroke="${col}" stroke-width="1.8" ${dash?`stroke-dasharray="${dash}"`:''}/>`).join('');
  const dots=series.map(([k,lab,col])=>BANDS.map(([b],i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(S[k].values[b]).toFixed(1)}" r="2.2" fill="${col}"/>`).join('')).join('');
  const xl=BANDS.map(([b,nm],i)=>`<text x="${x(i).toFixed(1)}" y="${H-B+11}" text-anchor="middle">${nm}</text>`).join('');
  const lg=series.map(([k,lab,col,dash],i)=>{const cx=L+(i%2)*140, cy=H-16+Math.floor(i/2)*12; return `<line x1="${cx}" x2="${cx+14}" y1="${cy}" y2="${cy}" stroke="${col}" stroke-width="2" ${dash?`stroke-dasharray="${dash}"`:''}/><text class="lg" x="${cx+17}" y="${cy+3}">${lab}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Reflectance by band for a deciduous and a conifer pixel in September and October">${vis}${grid}<line class="ax" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>${lines}${dots}${xl}<text x="${W-R}" y="${H-B+22}" text-anchor="end">wavelength, nm</text><text x="6" y="${T+4}" transform="rotate(-90 6 ${T+4})" text-anchor="end">reflectance</text>${lg}</svg>`;
}

  const lg=`<line x1="${L}" x2="${L+16}" y1="${H-5}" y2="${H-5}" stroke="var(--muted)" stroke-width="2.5"/><text class="lg" x="${L+19}" y="${H-2}">typical 2023–25</text><line x1="${L+110}" x2="${L+126}" y1="${H-5}" y2="${H-5}" stroke="var(--fg)" stroke-width="1.8"/><text class="lg" x="${L+129}" y="${H-2}">this year</text><line x1="${L+185}" x2="${L+201}" y1="${H-5}" y2="${H-5}" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="3 3"/><text class="lg" x="${L+204}" y="${H-2}">forecast</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Typical colour curve versus this year">${grid}${months}<line class="ax" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>${peak}<path d="${clim}" fill="none" stroke="var(--muted)" stroke-width="2.5" opacity=".8"/><path d="${obsPath}" fill="none" stroke="var(--fg)" stroke-width="1.8"/><path d="${fcPath}" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="3 3"/>${now}${od}${fd}<text x="6" y="${T+4}" transform="rotate(-90 6 ${T+4})" text-anchor="end">colour score</text>${lg}</svg>`;
}
function chartWeather(Wx){

}
