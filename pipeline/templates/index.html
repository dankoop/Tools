<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seattle Fall Color Sentinel</title>
<meta name="description" content="Where fall colour is turning across Seattle and King County, from Sentinel-2 imagery, tree phenology and weather.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: the map fills the screen; a bottom strip holds the week stepper and legend; details live in a sheet (phone) or a right-hand panel (desktop).
   Colour rule: the fall-colour scale (green → yellow → orange → red, brown for leaf-off) is the ONLY chromatic element and is used only to encode colour state. All chrome is neutral. */
:root{
  --bg:#f4f3ef; --panel:#fbfaf7; --panel-2:#edebe5; --fg:#1b1a18; --muted:#66625b; --line:#d6d2c9; --ink:#2a2824; --ink-fg:#fbfaf7;
  --c1:#1a8026; --c2:#f2d91a; --c3:#fa8c0d; --c4:#d91a0d; --c5:#785540;   /* data scale: green, yellow, orange, red, leaf-off brown */
  --display:"Fraunces",Georgia,serif; --body:"Source Sans 3",system-ui,sans-serif;
  --sheet:36vh; --strip:92px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151617;--panel:#1e2022;--panel-2:#2a2d30;--fg:#ebe8e1;--muted:#a19c93;--line:#3b3f44;--ink:#ebe8e1;--ink-fg:#151617;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151617;--panel:#1e2022;--panel-2:#2a2d30;--fg:#ebe8e1;--muted:#a19c93;--line:#3b3f44;--ink:#ebe8e1;--ink-fg:#151617;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:inherit}
#app{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;grid-template-columns:1fr}
#mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:#0f1113}
.leaflet-container{font-family:var(--body);background:#0f1113}
.leaflet-top.leaflet-right{margin-top:calc(46px + env(safe-area-inset-top,0px))}
.topbar{position:absolute;top:0;left:0;right:0;z-index:1100;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand h1{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em;line-height:1.1;background:var(--panel);padding:4px 10px;border-radius:8px;border:1px solid var(--line)}
.spacer{flex:1}
.btn{padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center;line-height:1.2}
#btn-layers{max-width:46vw;white-space:nowrap}
#btn-layers span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.btn[aria-pressed=true],.btn.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink);font-weight:600}
.btn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible,.item:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.layerbox{position:absolute;right:12px;top:calc(52px + env(safe-area-inset-top,0px));z-index:1150;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;width:min(320px,calc(100vw - 24px));box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px}
.layerbox label{display:flex;align-items:center;gap:8px;font-size:14px}
.layerbox .row{display:flex;gap:8px 14px;flex-wrap:wrap}
.layerbox select{width:100%;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2)}
.layerbox input[type=checkbox]{accent-color:var(--ink)}
/* bottom strip: stepper + legend + provenance */
.strip{position:absolute;left:0;right:0;bottom:0;z-index:1100;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px 8px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
@media (max-width:899px){.strip{grid-template-columns:1fr}.legend{max-width:none}.prov{grid-column:1}.step{min-width:56px}}
.stepper{display:flex;gap:4px;align-items:stretch;overflow-x:auto;scrollbar-width:none}
.step{flex:1 0 auto;min-width:64px;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:4px 6px;font-size:12px;line-height:1.15;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.step b{font-weight:600;font-size:12.5px}
.step small{color:var(--muted);font-size:11px}
.step[aria-pressed=true]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.step[aria-pressed=true] small{color:var(--ink-fg);opacity:.75}
.step:disabled{opacity:.4;cursor:default}
.playbtn{align-self:stretch;min-width:40px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);cursor:pointer;font-size:14px}
.legend{font-size:12px;min-width:0;max-width:260px}
.legend b{display:block;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .ramp{height:8px;border-radius:4px;margin:2px 0}
.legend .labels{display:flex;justify-content:space-between;gap:4px;color:var(--muted);font-size:10.5px}
.legend .cls{display:flex;gap:8px;flex-wrap:wrap}
.legend .cls span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.legend .cls i{width:11px;height:11px;border-radius:3px;display:inline-block}
.prov{grid-column:1/-1;color:var(--muted);font-size:11.5px;display:flex;gap:12px;flex-wrap:wrap}
/* sheet / panel */
.sheet{position:absolute;left:0;right:0;bottom:0;height:var(--sheet);z-index:1200;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.22);transition:height .25s ease}
.sheet.collapsed{height:84px}
.grip{height:18px;display:flex;align-items:center;justify-content:center;cursor:grab;flex:none}
.grip i{width:40px;height:4px;border-radius:2px;background:var(--line)}
.verdict{padding:0 14px 6px;font-size:14px;line-height:1.35;flex:none}
.verdict b{font-weight:700}
.verdict .more{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:2px;padding:0 10px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
.tab{padding:6px 11px;border-radius:999px;border:1px solid transparent;background:transparent;cursor:pointer;white-space:nowrap;font-size:14px;color:var(--muted)}
.tab[aria-selected=true]{background:var(--panel-2);border-color:var(--line);color:var(--fg);font-weight:600}
.sheet-body{flex:1;overflow:auto;padding:4px 14px calc(16px + env(safe-area-inset-bottom,0px));min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.filters .btn{padding:4px 9px;font-size:13px}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:26px 1fr auto;gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--ink)}
.item .rank{font-weight:700;color:var(--muted);text-align:center;font-size:14px}
.item .name{font-weight:600;min-width:0;line-height:1.25}
.item .sub{grid-column:2;color:var(--muted);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .right{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.scorebar{width:64px;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.scorebar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:3px}
.scoretxt{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
.pill.s1{background:var(--c1);color:#fff}.pill.s2{background:var(--c2);color:#1b1a18}.pill.s3{background:var(--c3);color:#1b1a18}.pill.s4{background:var(--c5);color:#fff}.pill.s0{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11.5px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin:6px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;height:9px;border-radius:4px;overflow:hidden;margin:4px 0 2px;background:var(--line)}
.stack i{display:block;height:100%}
.stacklbl{display:flex;gap:10px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:400;font-size:12px}
td.n,th.n{text-align:right}
.tablewrap{overflow-x:auto;margin:6px 0 12px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.stat div{padding:8px 10px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line)}
.stat b{display:block;font-size:19px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.note{padding:8px 10px;border-left:3px solid var(--ink);background:var(--panel-2);border-radius:0 8px 8px 0;font-size:14px;margin:8px 0}
.about p,.about li{max-width:65ch}
details summary{cursor:pointer;font-weight:600;margin:6px 0}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--fg);border-radius:10px;border:1px solid var(--line);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:10px 12px;font-family:var(--body);font-size:14px;line-height:1.35;min-width:230px}
.leaflet-popup-content h3{font-family:var(--display);font-size:16px;margin-bottom:4px;font-weight:600}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.rank-badge{background:#1b1a18;color:#fff;font:600 12px/20px var(--body);width:22px;height:22px;border-radius:50%;text-align:center;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.stn{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #e8e6e0;filter:drop-shadow(0 0 2px #000)}
.rep{width:13px;height:13px;border-radius:2px;background:#e8e6e0;border:2px solid #1b1a18;transform:rotate(45deg)}
.plabel{color:#f1efe9;font:600 12px/1 var(--body);text-shadow:0 0 3px #000,0 0 6px #000,0 1px 2px #000;white-space:nowrap;letter-spacing:.02em;pointer-events:none}
.plabel.water{color:#b9c6cf;font-weight:400;font-style:italic}
.base-grey img{filter:grayscale(1) brightness(.95)}
.leaflet-control-attribution{background:rgba(0,0,0,.45)!important;color:#ccc!important;font-size:10px}
.leaflet-control-attribution a{color:#ddd!important}
.spark{display:block}
@media (min-width:900px){
  #app{grid-template-columns:1fr 400px;grid-template-rows:1fr}
  #mapwrap{grid-column:1}
  .sheet{position:relative;height:auto!important;grid-column:2;border-top:0;border-left:1px solid var(--line);border-radius:0;box-shadow:none;transition:none}
  .sheet.collapsed{height:auto}
  .grip{display:none}
  .verdict{padding-top:12px}
  .strip{grid-template-columns:1fr auto}
}
@media (max-width:899px){.strip{bottom:var(--sheet)}.topbar .brand h1{font-size:17px}.sheet.collapsed ~ .strip{bottom:84px}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

</style>

<div id="app">
 <div id="mapwrap">
  <div id="map" role="application" aria-label="Fall colour map"></div>
  <header class="topbar">
    <div class="brand"><h1>Seattle Fall Color Sentinel</h1></div>
    <span class="spacer"></span>
    <button class="btn" id="btn-layers" aria-expanded="false" aria-controls="layerbox">Layers · <span id="layer-name">Fall colour</span></button>

    <label>Show <select id="sel-layer" aria-label="Map layer"></select></label>
    <div class="row">
      <label><input type="checkbox" id="chk-clusters" checked> Hotspots</label>
      <label><input type="checkbox" id="chk-dest" checked> Places</label>
      <label><input type="checkbox" id="chk-labels" checked> Labels</label>

      <label><input type="checkbox" id="chk-reports"> Reports</label>
    </div>
    <div class="row">
      <label>Base <select id="sel-base" aria-label="Base map"><option value="grey">Imagery, greyscale</option><option value="rgb">Imagery, colour</option><option value="osm">Street map (needs internet tiles)</option><option value="none">Plain dark</option></select></label>
    </div>
    <label><input type="range" id="opacity" min="20" max="100" value="85" aria-label="Overlay opacity" style="accent-color:var(--ink)"> overlay opacity</label>
  </div>
  <div class="strip" id="strip">
    <div class="stepper" id="stepper" role="group" aria-label="Week"></div>
    <div class="legend" id="legend" aria-live="polite"></div>

 </div>
 <section class="sheet" id="sheet" aria-label="Details">

  <div class="verdict" id="verdict">Loading map data…</div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="hot" aria-selected="true">Hotspots</button>
    <button class="tab" role="tab" data-tab="places">Places</button>
    <button class="tab" role="tab" data-tab="weather">Weather</button>
    <button class="tab" role="tab" data-tab="reports">Reports</button>
    <button class="tab" role="tab" data-tab="about">Method</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
 </section>
</div>

<script>{{LEAFLET_JS}}</script>
<script>
(async function(){
const $=s=>document.querySelector(s);
const STAGE={1:['green','s1'],2:['turning','s2'],3:['peak colour','s3'],4:['past peak','s4']};
const RAMP=[[26,128,38],[242,217,26],[250,140,13],[217,26,13]];
const fmt=(x,d=0)=>x==null||isNaN(x)?'–':Number(x).toFixed(d);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dstr=d=>`${MON[d.getMonth()]} ${d.getDate()}`;
const isoDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let site,weather,stations,reports,bounds,hotspots,dests,places;
try{
  [site,weather,stations,reports,bounds,hotspots,dests,places]=await Promise.all(['site.json','weather.json','stations.geojson','reports.geojson','boundaries.geojson','hotspots.geojson','destinations.geojson','places.json'].map(f=>fetch('data/'+f).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.json()})));
}catch(e){ $('#verdict').textContent='Could not load the map data ('+e.message+').'; $('#sheet-body').innerHTML='<p class="note">The data files must sit next to this page under data/. If you are viewing a preview, open the full page.</p>'; return; }
if(typeof L==='undefined'){ $('#verdict').textContent='The map library did not load in this viewer.'; return; }
const regions=Object.keys(site.regions); const hasCounty=regions.includes('county');
const weeks=(site.regions.seattle||site.regions.county).weeks;
const sumS=site.summary.seattle||{}, sumC=site.summary.county||{}; const summary=Object.keys(sumS).length?sumS:sumC;
const today=isoDate(summary.today||new Date().toISOString().slice(0,10));
const desktop=()=>innerWidth>=900;

// ---------------------------------------------------------------- helpers for words, dates, colours
function rampColor(x){x=Math.max(0,Math.min(1,x))*3;const i=Math.min(2,Math.floor(x)),f=x-i;const c=RAMP[i].map((v,j)=>Math.round(v*(1-f)+RAMP[i+1][j]*f));return `rgb(${c})`}
function intensityWord(v){return v<0.12?'mostly green':v<0.25?'first colour':v<0.4?'turning':v<0.55?'colourful':'vivid'}
function velocityWord(v){return v>0.04?'changing fast':v>0.015?'changing':v>-0.01?'holding':'fading'}
function stageOf(p){ // dominant state from fractions
  const pf=p.peak_fraction??(p.stage_fraction?p.stage_fraction.peak:0), lf=p.leafoff_fraction??(p.stage_fraction?p.stage_fraction['past peak']:0), tf=p.stage_fraction?p.stage_fraction.turning:null;
  if(lf>=0.3) return 4; if(pf>=0.35) return 3; if(p.intensity>=0.15||(tf!=null&&tf>=0.3)) return 2; return 1;
}
function stagePill(p){const s=stageOf(p);return `<span class="pill s${s}">${STAGE[s][0]}</span>`}
function timingText(d){ if(d==null||isNaN(d)) return 'no timing estimate'; if(d<-10){return `past peak (around ${dstr(new Date(today.getTime()+d*864e5))})`} if(d<=-3) return 'just past peak'; if(d<=2) return 'peak now'; const a=new Date(today.getTime()+(d-2)*864e5),b=new Date(today.getTime()+(d+2)*864e5); return `peak about ${dstr(a)}–${dstr(b)}` }
function timingShort(d){ if(d==null||isNaN(d)) return '–'; if(d<-10) return 'past peak'; if(d<=-3) return 'just past'; if(d<=2) return 'peak now'; return `peak ~${dstr(new Date(today.getTime()+d*864e5))}` }
function spark(series,w=64,h=20){const vals=Object.values(series||{});if(!vals.some(v=>v!=null))return'';const n=vals.length;const pts=vals.map((v,i)=>v==null?null:[(i/(n-1))*(w-4)+2,h-2-Math.max(0,Math.min(1,v))*(h-5)]).filter(Boolean);if(!pts.length)return'';const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const last=pts[pts.length-1];const lv=vals.filter(v=>v!=null).pop();return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${rampColor(lv)}" stroke="#1b1a18" stroke-width=".8"/></svg>`}
function scoreBar(v){return `<div class="scorebar" title="worth-visiting score ${fmt(v)}/100"><i style="width:${Math.round(v)}%"></i></div><span class="scoretxt">${fmt(v)}</span>`}
function stackBar(sf){const keys=[['green','c1'],['turning','c2'],['peak','c3'],['past peak','c5']];const tot=keys.reduce((a,[k])=>a+(sf[k]||0),0)||1;return `<div class="stack">${keys.map(([k,c])=>`<i style="width:${(sf[k]||0)/tot*100}%;background:var(--${c})"></i>`).join('')}</div><div class="stacklbl">${keys.map(([k])=>`<span>${k} ${Math.round((sf[k]||0)/tot*100)}%</span>`).join('')}</div>`}

// ---------------------------------------------------------------- map
const map=L.map('map',{zoomControl:false,attributionControl:true,minZoom:8,maxZoom:16,zoomSnap:0.25,zoomDelta:0.5});
L.control.zoom({position:'topright'}).addTo(map);
map.attributionControl.setPrefix('').addAttribution('Copernicus Sentinel-2 via AWS · ESA WorldCover · NOAA GHCN, HRRR, GFS');
const countyB=site.regions.county?site.regions.county.bounds:site.regions.seattle.bounds;
map.fitBounds((hasCounty&&desktop())?countyB:(site.regions.seattle||site.regions.county).bounds,{padding:[10,10]});
['basepane','countypane','seattlepane','vecpane','labelpane'].forEach((n,i)=>{map.createPane(n).style.zIndex=200+i*60});
map.getPane('labelpane').style.pointerEvents='none';
let osm=null; const baseImg={}, overlays={};
const imgUrl=(r,f)=>`data/${r}/${f}`;
for(const r of regions){
  baseImg[r]=L.imageOverlay('',site.regions[r].bounds,{pane:'basepane',opacity:1,interactive:false,className:'base-grey'}).addTo(map);
  overlays[r]=L.imageOverlay('',site.regions[r].bounds,{pane:r+'pane',opacity:.85,interactive:false}).addTo(map);
}
L.geoJSON(bounds,{pane:'vecpane',style:f=>({color:'#e8e6e0',weight:f.properties.name==='Seattle'?1.4:1,fill:false,opacity:.7,dashArray:f.properties.name==='Seattle'?null:'4 4'}),interactive:false}).addTo(map);

const LAYERS=[
 ['cs','Fall colour',true],['stage','Colour stage',true],['rgb','Imagery only',true],
 ['days_to_peak','Predicted days to peak',false],['dhue','Hue shift since early Sept',false],['dndvi','Greenness change',false],
 ['velocity','Change velocity',false],['decid','Deciduous likelihood',false],['confidence','Prediction confidence',false]];
const sel=$('#sel-layer'); LAYERS.forEach(([k,t])=>{const o=document.createElement('option');o.value=k;o.textContent=t;sel.appendChild(o)});
let layer=store.get('layer')||'cs', week=weeks.length; if(!LAYERS.some(l=>l[0]===layer)) layer='cs'; sel.value=layer;
function layerFile(region,k,w){
  const R=site.regions[region]; if(!R) return null;
  if(['cs','stage','rgb'].includes(k)){
    if(k==='rgb') return null;                                     // imagery only: the base shows it
    if(w>=weeks.length) return k==='cs'?R.layers.cs_now.file:R.layers.stage.file;
    return R.weeks[w][k];
  }
  return R.layers[k]?R.layers[k].file:null;
}

    <h3>How this map is made</h3>
    <p><b>Imagery.</b> Every Sentinel-2 L2A scene over MGRS tiles 10TET and 10TFT since Sept 1 is read from the public AWS archive at 10 m (Seattle) and 20 m (King County). Clouds, cirrus, shadows, snow and haze over vegetation are removed per pixel with the scene classification band plus blue and SWIR brightness tests, then dilated. Each week's layer is the median of its clear observations; “Now” is the latest clear observation per pixel, back-filled from the previous two weeks where the newest pass was cloudy, and the strip above states the date range actually used.</p>
    <p><b>Colour measures.</b> Hue and chroma come from the red, green and blue bands, so a pixel's shift from green toward yellow, orange and red is measured directly. The Plant Senescence Reflectance Index, (red − blue) / red-edge 2, tracks the carotenoid-to-chlorophyll ratio that rises as leaves senesce. NDVI and the red-edge chlorophyll index track greenness loss; NDMI (NIR, SWIR) flags leaf-off. The colour score blends hue shift and PSRI rise relative to each pixel's own early-September baseline, scaled down once NDVI shows the leaves are gone.</p>
    <p><b>Stages.</b> Green, turning, peak and past-peak are thresholds on the colour score and the NDVI drop. Conifers and lawns stay green and are not counted. Hotspot timing is reconciled with stage: a spot whose trees read as peak is never shown as “peak in a week”.</p>
    <p><b>Phenology.</b> Autumn 2023, 2024 and 2025 were processed the same way at 80 m. Each pixel gets a typical colour curve, peak week and autumn amplitude; small amplitude means evergreen. This year's progress is matched to that curve to estimate how many days ahead of or behind a normal year the spot is, which gives the predicted peak date, pulled earlier when cold nights are forecast and more so at elevation.</p>
    <p><b>Weather.</b> Nightly lows and cold-night counts come from NOAA GHCN stations (airports, SNOTEL) compared with the same dates in prior years, HRRR 3 km analyses fill the days after the station feed, and the 7-day outlook is the latest GFS run. Cold nights accelerate colour; strong wind or heavy rain after peak ends the show.</p>
    <p><b>Hotspots and scores.</b> Tree pixels are aggregated to 100 m cells in Seattle and 200 m cells elsewhere; the top tenth by colour score are grouped into contiguous hotspots and labelled by the nearest destination, neighbourhood or town. “Canopy” hotspots are mostly tree cover; “meadow / shrub” ones are huckleberry and mountain-ash slopes. The worth-a-visit score weights colour intensity 45%, timing against the predicted peak 20%, public access 20% and size 15%; it ranks places, it is not a measurement.</p>
    <p><b>Colour on this page.</b> The green–yellow–orange–red scale is used only to show colour state, on the map, in the stage pills and at the end of each sparkline. Timing and diagnostic layers use greys and teals so that orange never means anything but fall colour. The imagery base is greyscale by default for the same reason.</p>
    <p><b>Limits.</b> A 10 m pixel mixes several trees; street trees under cloud for two weeks show their last clear state; the phenology baseline is coarse, so timing is a guide. Reports are quoted from and linked to their sources.</p>
    <p class="muted">Generated ${site.generated}. Pipeline code: the <code>pipeline/</code> folder of this repository.</p></div>`;
